<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VANATUR | Меню</title>
    <meta name="description" content="Полное меню VANATUR: фирменные блюда, авторские сеты, десерты и сопровождение для красивого ужина." />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="menu">
    <header data-site-header></header>

    <main>
      <section class="page-hero">
        <div class="container hero-layout">
          <div class="hero-copy reveal">
            <p class="eyebrow">Меню VANATUR</p>
            <h1>Выберите блюда до бронирования.</h1>
            <p class="lead">Фирменные позиции, сеты для двоих и сопровождение, которое делает вечер завершённым.</p>
            <div class="hero-actions">
              <a class="button" href="/contact">Забронировать стол</a>
              <a class="button button-ghost" href="/restaurant">Ресторан</a>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-header reveal">
            <p class="eyebrow">Рекомендуем</p>
            <h2>С чего начать знакомство с кухней.</h2>
          </div>
          <div class="card-grid card-grid-tight" data-menu-highlights></div>
        </div>
      </section>

      <section class="section section-band">
        <div class="container">
          <div class="section-header reveal">
            <p class="eyebrow">Полное меню</p>
            <h2>Все направления кухни.</h2>
          </div>
          <div class="menu-category-grid" data-menu-categories></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-header reveal">
            <p class="eyebrow">Сопровождение</p>
            <h2>Напитки, сеты и сервисные детали.</h2>
          </div>
          <div class="card-grid card-grid-tight" data-menu-pairings></div>
          <div class="card-grid card-grid-tight menu-notes-grid" data-menu-notes></div>
        </div>
      </section>
    </main>

    <footer data-site-footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/menu.js"></script>
  </body>
</html>
