<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VANATUR | Admin</title>
    <meta name="description" content="Admin-панель VANATUR: управление контентом, меню, заявками и изображениями." />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="admin">
    <header data-site-header></header>

    <main>
      <!-- Login view -->
      <div class="admin-page" data-admin-login-view>
        <div class="container">
          <div class="admin-login-card surface-card">
            <div class="admin-login-header">
              <p class="eyebrow">VANATUR</p>
              <h1>Admin</h1>
              <p class="section-copy">Войдите для управления контентом, меню и заявками.</p>
            </div>
            <form class="inquiry-form" data-admin-login-form>
              <div class="form-grid">
                <label class="form-field form-field-wide">
                  <span>Email</span>
                  <input type="email" name="email" placeholder="admin@vanatur.am" required />
                </label>
                <label class="form-field form-field-wide">
                  <span>Пароль</span>
                  <input type="password" name="password" placeholder="Введите пароль" required />
                </label>
              </div>
              <div class="form-actions">
                <button class="button" type="submit">Войти</button>
                <a class="button button-ghost" href="/">На главную</a>
              </div>
              <p class="form-status" data-admin-status aria-live="polite"></p>
            </form>
          </div>
        </div>
      </div>

      <!-- Dashboard view -->
      <div class="admin-page" data-admin-dashboard-view style="display:none">
        <div class="container">
          <div class="admin-header">
            <div>
              <p class="eyebrow">VANATUR Admin</p>
              <h1>Панель управления</h1>
            </div>
            <button class="button button-ghost" type="button" data-admin-logout>Выйти</button>
          </div>

          <div class="admin-tabs" data-admin-tabs>
            <button class="admin-tab is-active" type="button" data-tab="inquiries">Заявки</button>
            <button class="admin-tab" type="button" data-tab="content">Тексты</button>
            <button class="admin-tab" type="button" data-tab="menu">Меню</button>
            <button class="admin-tab" type="button" data-tab="images">Изображения</button>
          </div>

          <!-- Inquiries panel -->
          <div class="admin-panel is-active" data-panel="inquiries">
            <div class="admin-section">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:1rem">
                <h2>Заявки</h2>
                <button class="button button-ghost" type="button" data-admin-refresh>Обновить</button>
              </div>
              <div data-admin-inquiries></div>
            </div>
          </div>

          <!-- Content editor panel -->
          <div class="admin-panel" data-panel="content">
            <div class="admin-section" data-content-editor></div>
          </div>

          <!-- Menu editor panel -->
          <div class="admin-panel" data-panel="menu">
            <div class="admin-section" data-menu-editor></div>
          </div>

          <!-- Images panel -->
          <div class="admin-panel" data-panel="images">
            <div class="admin-section" data-images-editor></div>
          </div>
        </div>
      </div>
    </main>

    <footer data-site-footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
